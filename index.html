<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Rubik - Thư Viện Full 119 Công Thức CFOP & Bấm Giờ</title>
  <meta name="description" content="Thư viện trọn bộ 119 công thức CFOP (Full 41 F2L, 57 OLL, 21 PLL) trực quan kèm đồng hồ bấm giờ chuẩn WCA.">
  
  <!-- Thẻ hiển thị đẹp khi gửi link qua Messenger, Zalo, Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="QA Rubik - Thư Viện Full CFOP & Đồng Hồ Bấm Giờ WCA">
  <meta property="og:description" content="Tra cứu nhanh 119 công thức F2L, OLL, PLL kèm sơ đồ nhận diện và luyện tập với đồng hồ chuẩn thi đấu.">
  <meta property="og:image" content="images/logo.png">

  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/formulas.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="brand" aria-label="Trang chủ QA Rubik">
      <img src="images/logo.png" alt="Logo QA Rubik" class="brand-logo">
      <span class="brand-name">QA Rubik</span>
    </a>

    <nav aria-label="Menu chính">
      <a href="index.html" class="nav-link active">Công thức</a>
      <a href="timer.html" class="nav-link">Bấm giờ</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero-banner">
      <div class="hero-text">
        <h1>Thư viện Full 119 công thức CFOP</h1>
        <p>Trọn bộ 41 F2L, 57 OLL và 21 PLL kèm sơ đồ nhận diện trực quan & theo dõi tiến độ thuộc bài.</p>
        <div class="progress-wrap">
          <span class="progress-text">Đã thuộc: <strong id="learned-count">0 / 119</strong> công thức</span>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
      </div>
      <a href="timer.html" class="cta-btn">Mở đồng hồ bấm giờ →</a>
    </section>

    <section class="toolbar" aria-label="Bộ lọc công thức">
      <div class="filter-bar">
        <button class="btn active" data-filter="all">Tất cả <span class="count-pill" id="count-all">0</span></button>
        <button class="btn" data-filter="F2L">F2L <span class="count-pill" id="count-F2L">0</span></button>
        <button class="btn" data-filter="OLL">OLL <span class="count-pill" id="count-OLL">0</span></button>
        <button class="btn" data-filter="PLL">PLL <span class="count-pill" id="count-PLL">0</span></button>
        <button class="btn" data-filter="learned">★ Đã thuộc</button>
      </div>

      <div class="search-box">
        <input type="text" id="search-input" placeholder="Tìm tên thế, mã (VD: T-Perm, Sune, OLL #21...)" aria-label="Tìm kiếm công thức">
      </div>
    </section>

    <section class="formula-grid" id="formula-grid"></section>
  </main>

  <footer class="site-footer">
    <p>© 2026 <strong>QA Rubik</strong> • Công cụ tra cứu Full CFOP & Luyện tập Speedcubing</p>
  </footer>

  <script src="js/formulas.js"></script>
</body>
</html>
